name: Report an app problem
description: Tell us about a crash, broken action, or unexpected behavior.
title: "[Report] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: textarea
    id: details
    attributes:
      label: Additional information
