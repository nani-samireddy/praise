name: Set up Flutter project
description: Install Java, Flutter, and Dart dependencies for Praise workflows.

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.47.0"
        channel: stable
        cache: true

    - name: Resolve dependencies
      shell: bash
      run: flutter pub get
