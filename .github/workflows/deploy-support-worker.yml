name: Deploy support worker

on:
  push:
    branches: [main]
    paths:
      - "support_worker/**"
      - ".github/workflows/deploy-support-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-support-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support_worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: support_worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test worker
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
