name: Import catalogue from Google Sheets

on:
  workflow_dispatch:
    inputs:
      catalogue_version:
        description: "Optional catalogue version; leave blank to publish the next version"
        required: false
        type: string
      sheet_csv_url:
        description: "Optional HTTPS CSV export URL; defaults to SONGS_SHEET_CSV_URL"
        required: false
        type: string
  repository_dispatch:
    types: [catalog_deploy]

permissions:
  contents: write

concurrency:
  group: import-sheet-catalog
  cancel-in-progress: false

jobs:
  import-build-publish:
    runs-on: ubuntu-latest
    env:
      CATALOG_REPOSITORY: ${{ vars.CATALOG_REPOSITORY }}
      DEFAULT_SHEET_CSV_URL: ${{ vars.SONGS_SHEET_CSV_URL }}
      SHEET_EXPORT_TOKEN: ${{ secrets.SHEET_EXPORT_TOKEN }}
    steps:
      - name: Check out app repository
        uses: actions/checkout@v6

      - name: Check configuration
        shell: bash
        env:
          CATALOG_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY }}
        run: |
          if [[ -z "$CATALOG_REPOSITORY" ]]; then
            echo "Set the CATALOG_REPOSITORY Actions variable to OWNER/REPOSITORY."
            exit 1
          fi
          if [[ -z "$CATALOG_DEPLOY_KEY" ]]; then
            echo "Add the catalogue repository deploy key as CATALOG_DEPLOY_KEY."
            exit 1
          fi

      - name: Resolve import inputs
        id: import-inputs
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.catalogue_version }}
          DISPATCH_URL: ${{ github.event.client_payload.sheet_csv_url }}
          MANUAL_VERSION: ${{ inputs.catalogue_version }}
          MANUAL_URL: ${{ inputs.sheet_csv_url }}
        run: |
          version="${MANUAL_VERSION:-$DISPATCH_VERSION}"
          sheet_url="${MANUAL_URL:-$DISPATCH_URL}"
          sheet_url="${sheet_url:-$DEFAULT_SHEET_CSV_URL}"
          if [[ -n "$version" ]] && { ! [[ "$version" =~ ^[0-9]+$ ]] || [[ "$version" -lt 1 ]]; }; then
            echo "catalogue_version must be a positive integer when provided."
            exit 1
          fi
          if [[ -z "$sheet_url" ]]; then
            echo "Provide sheet_csv_url or set SONGS_SHEET_CSV_URL."
            exit 1
          fi
          {
            echo "catalogue_version=$version"
            echo "sheet_csv_url=$sheet_url"
          } >> "$GITHUB_OUTPUT"

      - name: Import approved songs
        shell: bash
        run: |
          args=(
            python tool/import_sheet_catalog.py
            --url "${{ steps.import-inputs.outputs.sheet_csv_url }}"
            --output catalog/source/songs.normalized.csv
          )
          if [[ -n "$SHEET_EXPORT_TOKEN" ]]; then
            args+=(--token "$SHEET_EXPORT_TOKEN")
          fi
          "${args[@]}"

      - name: Build catalogue
        shell: bash
        run: |
          args=(
            python tool/build_catalog.py
            --input catalog/source/songs.normalized.csv
            --bundle-output assets/data/songs.json
            --bundle-all
          )
          if [[ -n "${{ steps.import-inputs.outputs.catalogue_version }}" ]]; then
            args+=(--version "${{ steps.import-inputs.outputs.catalogue_version }}")
          else
            args+=(--auto-version)
          fi
          "${args[@]}"

      - name: Read built catalogue version
        id: built-catalogue
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("docs/catalog/manifest.json", encoding="utf-8"))["catalogVersion"])')"
          echo "catalogue_version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate catalogue
        run: python tool/validate_catalog.py

      - name: Commit generated catalogue state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/data/songs.json \
            catalog/source/songs.normalized.csv \
            docs/catalog \
            tool/catalog_id_map.json
          if git diff --cached --quiet; then
            echo "Generated catalogue state is already committed."
            exit 0
          fi
          git commit -m "Import sheet catalogue v${{ steps.built-catalogue.outputs.catalogue_version }}"
          git push origin HEAD:${GITHUB_REF_NAME:-main}

      - name: Check out catalogue server repository
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.CATALOG_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          path: catalog-server

      - name: Synchronize published files
        shell: bash
        run: |
          mkdir -p catalog-server/catalog
          rsync --archive --delete docs/catalog/ catalog-server/catalog/
          mkdir -p catalog-server/list
          rsync --archive --delete docs/list/ catalog-server/list/
          touch catalog-server/.nojekyll

      - name: Publish changed catalogue
        working-directory: catalog-server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll catalog list
          if git diff --cached --quiet; then
            echo "The catalogue server is already current."
            exit 0
          fi
          git commit -m "Publish sheet catalogue v${{ steps.built-catalogue.outputs.catalogue_version }}"
          git push origin HEAD:main

      - name: Notify catalogue deployment channel
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CATALOG_DEPLOYMENTS_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          CATALOGUE_VERSION: ${{ steps.built-catalogue.outputs.catalogue_version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_CATALOG_DEPLOYMENTS_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          status = os.environ.get("JOB_STATUS", "unknown")
          version = os.environ.get("CATALOGUE_VERSION") or "not built"
          run_url = os.environ["RUN_URL"]
          color = 0x2EA043 if status == "success" else 0xD1242F
          payload = {
              "username": "Praise Releases",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": f"Catalogue deployment {status}",
                      "color": color,
                      "fields": [
                          {"name": "Catalogue version", "value": str(version), "inline": True},
                          {"name": "Workflow", "value": f"[Open run]({run_url})", "inline": True},
                      ],
                  }
              ],
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except Exception as error:
              print(f"Discord notification failed: {error}")
          PY
