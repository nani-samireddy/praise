name: Build signed release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to commits already merged into main."
            echo "Open a release-prep PR, merge it to main, then create the tag from main."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify release tag and version
        run: python tool/verify_release_version.py --tag "$GITHUB_REF_NAME"

      - name: Check signing secrets
        shell: bash
        run: |
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Actions secret: $name"
              exit 1
            fi
          done

      - name: Configure release signing
        shell: bash
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_RELEASE_STORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test release tooling
        run: python -m unittest discover -s test/tool -p "test_*.py"

      - name: Test support API
        run: python -m unittest discover -s support_api/tests -p "test_*.py"

      - name: Validate catalogue
        run: python tool/validate_catalog.py

      - name: Build signed Android artifacts
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          cd android
          ./gradlew :app:bundleRelease

      - name: Verify native release payloads
        run: |
          python tool/verify_android_artifacts.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aab build/app/outputs/bundle/release/app-release.aab

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Praise-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/Praise-${GITHUB_REF_NAME}.aab"
          cd dist
          sha256sum "Praise-${GITHUB_REF_NAME}.apk" \
            "Praise-${GITHUB_REF_NAME}.aab" > SHA256SUMS.txt

      - name: Store Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praise-${{ github.ref_name }}-play
          path: |
            dist/Praise-${{ github.ref_name }}.aab
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/Praise-${GITHUB_REF_NAME}.apk" \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/Praise-${GITHUB_REF_NAME}.apk" \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Praise ${GITHUB_REF_NAME#v}"
          fi

      - name: Notify app releases channel
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_APP_RELEASES_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_APP_RELEASES_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          status = os.environ.get("JOB_STATUS", "unknown")
          tag = os.environ["RELEASE_TAG"]
          run_url = os.environ["RUN_URL"]
          release_url = os.environ["RELEASE_URL"]
          color = 0x2EA043 if status == "success" else 0xD1242F
          payload = {
              "username": "Praise Releases",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": f"App release {tag} {status}",
                      "color": color,
                      "fields": [
                          {"name": "GitHub release", "value": f"[Open release]({release_url})", "inline": True},
                          {"name": "Workflow", "value": f"[Open run]({run_url})", "inline": True},
                      ],
                  }
              ],
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except Exception as error:
              print(f"Discord notification failed: {error}")
          PY

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f android/release-keystore.jks android/key.properties
